# ===========================================================================
# Whole-heart 3D network OUTPUT label space
# ===========================================================================
# What `cardioform reconstruct` writes. This is ONE of several label spaces;
# see cardio_form/config.py LABEL_SPACES. The 2D segmentation outputs use a
# DIFFERENT convention (there 1 is blood pool and 2 is myocardium).
# ===========================================================================

# --- Individual Label Definitions ---
# Each key is the "short name" we will use in scripts.
labels:
  LV_myo: 1   # Left Ventricle Myocardium
  LV_bp: 2    # Left Ventricle Blood Pool
  RV_bp: 3    # Right Ventricle Blood Pool
  MYO_septum: 4 # UNVERIFIED. Upstream QC calls this 'Aorta'; neither source is
                # authoritative. Problematic, often merged or deleted.
  LA_bp: 5    # Left Atrium Blood Pool
  RA_bp: 6    # Right Atrium Blood Pool
  Ao: 7       # UNVERIFIED. Upstream QC calls this 'Aorta/PA'.
  PA: 8       # Pulmonary Artery
  PV_left: 9   # Left pulmonary vein, from the left-heart completion
  PV_right: 10 # Right pulmonary veins, from the left-heart completion

# --- Group Definitions ---
# These are convenient collections of labels for common tasks.
groups:
  # The structures you are most interested in
  ventricles:
    - LV_myo
    - LV_bp
    - RV_bp
  
  # All blood pools
  blood_pools:
    - LV_bp
    - RV_bp
    - LA_bp
    - RA_bp
    - Ao
    - PA
    
  # All labels that are generally considered "correct" and not problematic
  standard_anatomy:
    - LV_myo
    - LV_bp
    - RV_bp
    # Note: MYO_septum (label 4) is intentionally left out of this group
    - LA_bp
    - RA_bp
    - Ao
    - PA