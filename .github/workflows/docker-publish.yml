name: Docker Publish on Release

on:
  release:
    types: [published]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- FIX 1: ADD THIS STEP TO FREE UP DISK SPACE ---
      - name: Maximize build space
        uses: easimon/maximize-build-space-action@v10
        with:
          root-reserve-mb: 512
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      # CORRECTIVE STEP: Add docker/metadata-action to generate tags and labels
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: cemrg/cardio-form # Docker Hub repository name
          tags: |
            type=semver,pattern={{version}} # e.g., v0.2.0 -> 0.2.0
            type=semver,pattern={{major}}.{{minor}} # e.g., v0.2.0 -> 0.2
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # MODIFIED STEP: Use the generated tags for the GPU image
      - name: Build and push GPU Docker image
        id: build-gpu
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile.gpu # Corrected path
          push: true
          tags: |
            ${{ steps.meta.outputs.tags }}-gpu
          labels: ${{ steps.meta.outputs.labels }}

      # MODIFIED STEP: Use the generated tags for the CPU image
      - name: Build and push CPU Docker image
        id: build-cpu
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile.cpu # Corrected path
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}