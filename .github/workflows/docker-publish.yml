name: Docker Publish on Release

# This workflow runs automatically whenever a new release is created
on:
  release:
    types: [published]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push GPU Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.gpu # Specify the GPU dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}-gpu # Add a -gpu suffix, e.g., 0.2.0-gpu
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build and push CPU Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.cpu # Specify the CPU dockerfile (latest tag by default)
          push: true
          tags: ${{ steps.meta.outputs.tags }} # NO suffix for the CPU one, e.g., 0.2.0
          labels: ${{ steps.meta.outputs.labels }}
