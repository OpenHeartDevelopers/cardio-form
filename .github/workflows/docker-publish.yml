name: Docker Publish on Release

on:
  release:
    types: [published]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: cemrg/cardio-form
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --- CONTINGENCY: GPU BUILD STEP DISABLED ---
      # This step is temporarily disabled to resolve build failures on the GitHub
      # Actions runner due to excessive disk space usage by the GPU libraries.
      # Only the CPU image will be published until this is resolved.
      #
      # - name: Build and push GPU Docker image
      #   id: build-gpu
      #   uses: docker/build-push-action@v6
      #   with:
      #     context: .
      #     file: ./docker/Dockerfile.gpu
      #     push: true
      #     tags: |
      #       ${{ steps.meta.outputs.tags }}-gpu
      #     labels: ${{ steps.meta.outputs.labels }}

      - name: Build and push CPU Docker image
        id: build-cpu
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile.cpu
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}